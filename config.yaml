# Recon Tool Configuration

subdomain_enum:
  # Available sources: crtsh, dnsdumpster, securitytrails, shodan, censys, 
  # hackertarget, rapiddns, alienvault, virustotal, wayback, bufferover, 
  # threatcrowd, anubis, riddler, bruteforce
  sources:
    - crtsh
    - dnsdumpster
    - hackertarget
    - rapiddns
    - alienvault
    - wayback
    - bufferover
    - threatcrowd
    - anubis
    - riddler
    - bruteforce
  # API keys for sources that require them (set via environment variables or here)
  api_keys:
    securitytrails: ""  # SecurityTrails API key
    shodan: ""          # Shodan API key
    censys_id: ""       # Censys API ID
    censys_secret: ""   # Censys API Secret
    virustotal: ""      # VirusTotal API key
  wordlist: "wordlists/subdomains.txt"
  threads: 50
  timeout: 10
  recursive: false      # Enable recursive subdomain enumeration
  max_depth: 2          # Max depth for recursive enumeration

# Stealth/Evasion Configuration
stealth:
  enabled: true                    # Enable stealth mode
  initial_delay_min: 5.0           # Min initial delay before starting (seconds)
  initial_delay_max: 30.0          # Max initial delay before starting (seconds)
  request_delay_min: 1.0           # Min delay between requests (seconds)
  request_delay_max: 5.0           # Max delay between requests (seconds)
  jitter_factor: 0.3               # Jitter factor (0.0-1.0) for randomization
  rate_limit: 10.0                 # Requests per second (token bucket)
  burst_allowance: 5               # Burst allowance for token bucket
  randomize_order: true            # Randomize request order
  rotate_user_agent: true          # Rotate user agents per request

# HTTP Reconnaissance Configuration
http_recon:
  timeout: 10                      # Request timeout (seconds)
  follow_redirects: true           # Follow HTTP redirects
  test_methods: true               # Test HTTP methods (OPTIONS, TRACE, etc.)
  max_redirects: 10                # Maximum redirects to follow

# SSL/TLS Analyzer Configuration
ssl_analyzer:
  port: 443                        # Port to scan (default 443)
  timeout: 10                      # Connection timeout (seconds)
  check_ct_logs: true              # Query Certificate Transparency logs
  check_vulnerabilities: true      # Check for known SSL/TLS vulnerabilities
  deep_scan: false                 # Deep scan (more thorough but slower)

# Directory/File Enumeration Configuration
dir_enum:
  timeout: 10                      # Request timeout (seconds)
  threads: 20                      # Concurrent threads
  recursive: false                 # Enable recursive directory scanning
  max_depth: 3                     # Maximum recursion depth
  extensions:                      # File extensions to test
    - ''
    - '.php'
    - '.html'
    - '.js'
    - '.json'
    - '.xml'
    - '.txt'
    - '.bak'
    - '.backup'
    - '.old'
    - '.orig'
    - '.swp'
    - '.tmp'
    - '.temp'
    - '.log'
    - '.sql'
    - '.zip'
    - '.tar.gz'
    - '.tgz'
    - '.rar'
    - '.7z'
    - '.gz'
    - '.bz2'
    - '.xz'
  detect_tech: true                # Auto-detect technology for smart wordlists
  follow_redirects: true           # Follow HTTP redirects
  status_codes:                    # Status codes to consider as "found"
    - 200
    - 204
    - 301
    - 302
    - 307
    - 308
    - 401
    - 403
    - 405
    - 500
  exclude_status:                  # Status codes to exclude
    - 404

# Technology Fingerprinting Configuration
tech_fingerprint:
  timeout: 10                      # Request timeout (seconds)
  custom_fingerprints: null        # Custom fingerprint definitions (optional)

port_scan:
  ports: "1-1000,3306,5432,8080,8443"
  scan_type: "syn"  # syn, connect, udp
  timeout: 5
  use_nmap: true

dns_enum:
  record_types:
    - A
    - AAAA
    - MX
    - TXT
    - NS
    - CNAME
    - SOA
  resolvers:
    - 8.8.8.8
    - 1.1.1.1
    - 9.9.9.9
  try_zone_transfer: true

output:
  format: "json"  # json, csv, txt, table, tree
  file: null

general:
  user_agent: "ReconTool/1.0"
  rate_limit: 100  # requests per second (legacy, use stealth.rate_limit)
  proxy: null